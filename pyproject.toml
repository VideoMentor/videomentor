[project]
name = "videomentor"
version = "0.12.2"
description = "Triage saved YouTube videos fast and turn keepers into business learnings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.120.0",
    "uvicorn==0.38.0",
    "yt-dlp[default]==2026.10.21",
]

[project.urls]
Homepage = "https://github.com/videomentor/videomentor"
Issues = "https://github.com/videomentor/videomentor/issues"

[project.scripts]
vm = "videomentor.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
    "ruff==0.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videomentor"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI Depends() defaults. E501: the formatter owns line length; long SQL strings stay whole.
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
